<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101018">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OpenMMO">
  <link rel="manifest" href="app.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>OpenMMO</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/battle.css">
  <link rel="stylesheet" href="css/frontier.css">
</head>
<body>
  <div id="loadbar" class="hidden" role="progressbar" aria-label="Loading"><i></i></div>
  <!-- ============================================================ loading screen -->
  <section id="splash" class="screen" aria-live="polite" aria-busy="true">
    <div class="card">
      <h1 class="logo">Open<span>MMO</span></h1>
      <div class="sbar" role="progressbar" aria-label="Loading game data" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
      <p id="splash-status" class="status">Loading…</p>
    </div>
  </section>
  <!-- ============================================================ login -->
  <section id="login" class="screen hidden">
    <form id="login-form" class="card" autocomplete="on">
      <h1>Open<span>MMO</span></h1>
      <div id="login-tabs" class="tabs" role="tablist" aria-label="Log in or register">
        <button type="button" id="tab-login" role="tab" aria-selected="true" class="on">登录 / Log in</button>
        <button type="button" id="tab-register" role="tab" aria-selected="false">注册 / Register</button>
      </div>
      <label>Username <input id="user" name="username" autocomplete="username" required maxlength="32" autocapitalize="off" spellcheck="false"></label>
      <label>Password <input id="pass" name="password" type="password" autocomplete="current-password" required maxlength="64"></label>
      <label class="reg-only hidden">Repeat password <input id="pass2" name="password2" type="password" autocomplete="new-password" maxlength="64"></label>
      <label class="reg-only hidden">Invite code / 邀请码 <input id="invite" name="invite" maxlength="32" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX"></label>
      <p class="reg-only hidden hint">3–16 letters, digits or _ · password at least 8 characters</p>
      <label>Character <input id="cname" name="character" maxlength="12" autocapitalize="off" spellcheck="false" placeholder="same as username"></label>
      <label>Region
        <select id="region" name="region">
          <option value="0">Kanto</option>
          <option value="1">Hoenn</option>
        </select>
      </label>
      <label>New character
        <select id="gender" name="gender">
          <option value="0">Boy</option>
          <option value="1">Girl</option>
        </select>
      </label>
      <label class="check"><input id="remember" type="checkbox" checked> Stay logged in on this device</label>
      <button id="login-btn" type="submit" class="primary">Log in</button>
      <p id="login-status" class="status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <!-- ============================================================ game -->
  <section id="game" class="screen hidden">
    <header id="topbar">
      <span id="conn" class="conn" title="connection"><i></i><b id="conn-text">offline</b></span>
      <span id="rtt">– ms</span>
      <span id="mapname"></span>
      <span class="grow"></span>
      <span id="money" title="money">₽0</span>
      <button id="btn-reconnect" class="hidden small">Reconnect</button>
      <button id="btn-menu" class="small" aria-label="Open menu" aria-haspopup="dialog">☰ Menu</button>
    </header>

    <div id="stage">
      <canvas id="screen" width="240" height="160" tabindex="0" role="application" aria-label="Game screen. Arrow keys move, Z talks, X goes back, Tab opens the menu, Enter opens chat."></canvas>
      <!-- overlay sized exactly like the canvas; children laid out in GBA pixels (var(--u)) -->
      <div id="ov">
        <div id="battle" class="hidden" aria-live="polite"></div>
        <div id="dialog" class="hidden"></div>
        <div id="fps" class="hidden"></div>
      </div>
    </div>

    <aside id="chat" class="collapsed">
      <div id="chat-log" aria-live="polite"></div>
      <form id="chat-form" autocomplete="off">
        <input id="chat-input" maxlength="200" placeholder="Enter to chat, / for commands" enterkeyhint="send" autocapitalize="off">
      </form>
    </aside>

    <!-- touch controls -->
    <div id="touch" class="hidden" aria-hidden="true">
      <div id="dpad"><span class="u"></span><span class="d"></span><span class="l"></span><span class="r"></span><i></i></div>
      <div id="sysbtns">
        <button id="t-chat" class="pill">CHAT</button>
        <button id="t-run" class="pill">RUN</button>
        <button id="t-menu" class="pill">MENU</button>
      </div>
      <div id="abtns">
        <button id="t-b" class="round b">B</button>
        <button id="t-a" class="round a">A</button>
      </div>
    </div>

    <div id="panels"></div>
    <div id="connbanner" class="hidden" role="alert" aria-live="assertive">
      <b id="connbanner-text">Connection lost</b>
      <button id="connbanner-retry" type="button" class="small">Retry now</button>
    </div>
    <div id="help" class="hidden" role="dialog" aria-modal="true" aria-labelledby="help-title"></div>
    <div id="toast" class="hidden" role="status"></div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
